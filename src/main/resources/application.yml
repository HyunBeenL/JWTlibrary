server:
  port: 8080

auth:
  jwt:
    issuer: jwt-demo
    secret: ${JWT_SECRET:change-me-please-32bytes-minimum-change-me}
    access-ttl-min: 30
    refresh-ttl-days: 14
    cookie-domain: localhost
    cookie-secure: false     # https면 true
    cookie-samesite: Lax     # 프론트가 다른 도메인이면 None(+ Secure true)


spring:
  profiles:
    active: local   # 로컬 기본 (환경변수 SPRING_PROFILES_ACTIVE로 덮어쓰기 가능)
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://localhost:3306/JWT?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: root
    password: 1234


logging:
  level:
    org.springframework.security: DEBUG

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

